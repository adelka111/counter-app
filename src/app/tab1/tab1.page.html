<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CounterApp</ion-title>
  </ion-toolbar>
</ion-header>

  <ion-toast
    [isOpen]="isSavedToastOpen()"
    message="Počítadlo bylo uloženo."
    [duration]="2000"
    position="bottom"
    (didDismiss)="isSavedToastOpen.set(false)"
  ></ion-toast>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-counter
    heading="Nové počítadlo"
    (saved)="onSaved($event)"
  ></app-counter>
</ion-content>
